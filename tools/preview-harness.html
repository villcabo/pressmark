<!doctype html><meta charset="utf-8">
<!--
  Sheet-layout harness.

  The preview slices one continuous document into page-sized sheets, and that
  arithmetic is not something a screenshot settles: two sheets can look right
  and still repeat a band of text where the margins fall.

  This reproduces the structure with numbered lines and MEASURES which lines
  land on which sheet. Run it and read the numbers:

    google-chrome --headless --disable-gpu --no-sandbox \
      --virtual-time-budget=3000 --dump-dom tools/preview-harness.html \
      | grep -A6 'id="out"'

  Correct output has each sheet continuing exactly where the last ended:
    sheet 0: p0  -> p18
    sheet 1: p19 -> p37
    sheet 2: p38 -> p56

  Overlapping ranges mean the clipping is at the wrong element — the bug this
  was written to find.
-->
<style>
  body { margin:0; background:#222; font-family: monospace; }
  .stage { }
  .sheets { transform-origin: top left; }
  .sheet { position: relative; overflow: hidden; background:#fff; margin-bottom: 26px; }
  .content { position:absolute; left:0; right:0; overflow:hidden; }
  .frame { position: absolute; left: 0; display:block; border:0; background:transparent; }
  #out { color:#0f0; background:#000; padding:8px; white-space:pre; font-size:13px; }
</style>
<div id="out">midiendo…</div>
<div class="stage"><div class="sheets" id="sheets"></div></div>
<script>
// Documento de prueba: 40 párrafos numerados, para saber exactamente qué se ve
const doc = `<!doctype html><meta charset="utf-8">
<!--
  Sheet-layout harness.

  The preview slices one continuous document into page-sized sheets, and that
  arithmetic is not something a screenshot settles: two sheets can look right
  and still repeat a band of text where the margins fall.

  This reproduces the structure with numbered lines and MEASURES which lines
  land on which sheet. Run it and read the numbers:

    google-chrome --headless --disable-gpu --no-sandbox \
      --virtual-time-budget=3000 --dump-dom tools/preview-harness.html \
      | grep -A6 'id="out"'

  Correct output has each sheet continuing exactly where the last ended:
    sheet 0: p0  -> p18
    sheet 1: p19 -> p37
    sheet 2: p38 -> p56

  Overlapping ranges mean the clipping is at the wrong element — the bug this
  was written to find.
--><style>
  body{margin:0;padding:0 60px;font:16px/1.6 monospace;}
  p{margin:0 0 12px;height:40px;}
</style>` + Array.from({length:60},(_,i)=>`<p id="p${i}">LINEA ${i}</p>`).join("");

const W = 794, H = 1122;            // A4 @96dpi
const MT = 76, MB = 68;             // márgenes 20mm / 18mm
const CONTENT = H - MT - MB;        // lo que entra por carilla
const PAGES = 3;

const sheets = document.getElementById("sheets");
for (let i = 0; i < PAGES; i++) {
  const s = document.createElement("div");
  s.className = "sheet";
  s.style.width = W + "px"; s.style.height = H + "px";
  // La caja de contenido recorta: la hoja entera dejaba ver los márgenes
  const box = document.createElement("div");
  box.className = "content";
  box.style.top = MT + "px";
  box.style.height = CONTENT + "px";
  const f = document.createElement("iframe");
  f.className = "frame";
  f.srcdoc = doc;
  f.style.width = W + "px";
  f.style.height = (CONTENT * PAGES) + "px";
  f.style.top = (-i * CONTENT) + "px";
  box.appendChild(f); s.appendChild(box); sheets.appendChild(s);
}

// Medir: qué párrafo es el primero VISIBLE dentro de cada hoja
setTimeout(() => {
  const lines = [`CONTENT=${CONTENT}px  MT=${MT}  H=${H}`];
  document.querySelectorAll(".sheet").forEach((sheet, i) => {
    const f = sheet.querySelector("iframe");
    const d = f.contentDocument;
    const sr = sheet.querySelector(".content").getBoundingClientRect();
    let first = null, last = null;
    d.querySelectorAll("p").forEach(p => {
      const r = p.getBoundingClientRect();
      const top = r.top + f.getBoundingClientRect().top;
      if (top >= sr.top - 1 && top < sr.bottom) { if (first===null) first = p.id; last = p.id; }
    });
    lines.push(`hoja ${i}: iframe.top=${f.style.top}  primero=${first}  ultimo=${last}`);
  });
  document.getElementById("out").textContent = lines.join("\n");
}, 400);
</script>
