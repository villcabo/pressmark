name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  # Required to sign the build provenance of the release assets. Without it
  # users cannot cryptographically verify the files came from this repository.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The tag MUST match manifest.json: the store requires it, and a
      # mismatched release is rejected without saying why.
      - name: Tag must match manifest.json
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          man=$(jq -r .version manifest.json)
          if [ "$tag" != "$man" ]; then
            echo "tag $tag != manifest.json $man"
            exit 1
          fi

      - name: Install deps
        run: |
          bun install --frozen-lockfile
          cd plugin && bun install --frozen-lockfile

      - name: Validate theme packs
        run: bun tools/validate.mjs

      - name: Build plugin
        run: |
          make sync-themes
          cd plugin && bun run build

      # Proves the assets were built by this workflow from this repository.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "main.js, manifest.json, styles.css"

      # Exactly the three files the store expects as release assets.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "${GITHUB_REF#refs/tags/}" \
            --generate-notes \
            main.js manifest.json styles.css
