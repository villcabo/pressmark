name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      # npm ci, not npm install: it fails on a lockfile nobody committed, which
      # is exactly the failure the directory review reported.
      - name: Install
        run: npm ci

      # Un theme pack invalido no debe llegar ni al CLI ni al plugin.
      - name: Validate theme packs
        run: npm run validate

      - name: Sync themes into both consumers
        run: make sync-themes

      - name: Go tests
        run: cd cli && go test ./...

      - name: Go vet
        run: cd cli && go vet ./...

      - name: gofmt
        run: |
          out=$(gofmt -l cli)
          if [ -n "$out" ]; then echo "sin formatear:"; echo "$out"; exit 1; fi

      # src/themes.generated.ts is committed so a clean checkout has types for
      # EMBEDDED without a build step. Committed generated files drift, so this
      # proves it still matches themes/.
      - name: Generated themes are up to date
        run: |
          node tools/gen-plugin-themes.mjs
          git diff --exit-code -- src/themes.generated.ts

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      # The same rules the Obsidian community directory runs on submission.
      - name: Lint (Obsidian plugin rules)
        run: npx eslint src --max-warnings 5

      # Los fixtures de testdata/conformance/ corren en los DOS lados: si Go y
      # TypeScript divergen, esto falla.
      - name: TypeScript tests
        run: bun test src

      - name: Build CLI
        run: cd cli && go build ./...

      - name: Build plugin
        run: npm run build

      - name: The built artifacts must exist at the repo root
        run: test -f main.js && test -f manifest.json && test -f styles.css
